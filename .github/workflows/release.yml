name: Prepare release draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hfml-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check published dependency advisories
        run: python3 tools/check_vulnerabilities.py
      - name: Build with full corresponding sources and security tests
        run: python3 tools/build.py --test --release
      - name: Verify every file
        run: python3 tools/verify_checksums.py dist
      - name: Package distribution
        run: python3 tools/package_release.py
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/HFML-release.zip
            release/HFML-source.zip
            release/HFML.jar
      - name: Create draft release from this reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          
          
          def get_json(route, token, missing_ok=False):
              request = urllib.request.Request(
                  'https://api.github.com/' + route,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'User-Agent': 'Hoshino-Fuji-Launcher-release'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise RuntimeError('GitHub tag query failed: HTTP ' + str(error.code)) from None
          
          
          def check_tag(fetch, tag, commit):
              data = fetch('git/ref/tags/' + tag, True)
              if data is None:
                  return
              obj = data['object']
              for _ in range(8):
                  if not re.fullmatch('[0-9a-f]{40}', obj['sha']):
                      raise RuntimeError('Invalid tag object SHA')
                  if obj['type'] == 'commit':
                      if obj['sha'] != commit:
                          raise RuntimeError('Existing version tag points to another commit; review it before releasing')
                      return
                  if obj['type'] != 'tag':
                      raise RuntimeError('Unexpected tag object type')
                  obj = fetch('git/tags/' + obj['sha'], False)['object']
              raise RuntimeError('Too many nested annotated tags')
          
          
          def main():
              sys.path.insert(0, 'tools')
              from build import VERSION
              tag = 'v' + VERSION
              repo, token, commit = os.environ['GH_REPO'], os.environ['GH_TOKEN'], os.environ['GITHUB_SHA']
              check_tag(lambda route, missing: get_json('repos/' + repo + '/' + route, token, missing), tag, commit)
              subprocess.run(['gh', 'release', 'create', tag,
                              'release/HFML-release.zip', 'release/HFML-source.zip',
                              'release/HFML.jar', 'release/SHA256SUMS.txt',
                              '--target', commit, '--draft', '--generate-notes'], check=True)
          
          
          if __name__ == '__main__':
              main()
          PY
